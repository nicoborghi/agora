<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <nav id="rail"></nav>
    <aside id="sidebar">
      <div id="sidebar-head"><span id="sidebar-title">All</span></div>
      <div id="search-box"><input id="search" type="text" placeholder="Search messages" spellcheck="false" autocomplete="off" title="Search (Ctrl+F)"><div id="search-pop" hidden></div></div>
      <div id="channel-list"></div>
      <div id="status-line" hidden></div>
      <div id="me-bar" hidden></div>
    </aside>
    <div class="resizer" data-target="sidebar"></div>
    <main id="main">
      <header id="ch-header"></header>
      <div id="messages"></div>
      <div id="typing"></div>
      <div id="composer" class="composer" hidden>
        <div id="compose-info" class="compose-info" hidden></div>
        <div class="compose-box">
          <div id="attach-tray" class="attach-tray" hidden></div>
          <div class="compose-row">
            <textarea id="input" rows="1" spellcheck="true"></textarea>
          </div>
          <div id="fmt-bar" class="fmt-bar"></div>
        </div>
        <div id="drop-hint" class="drop-hint" hidden>Drop files to attach them</div>
      </div>
      <div id="home" class="home-view" hidden></div>
      <div id="empty" class="empty">
        <p>Select a conversation.</p>
        <p class="muted"><kbd>Ctrl</kbd> <kbd>K</kbd> quick switch &middot; <kbd>Ctrl</kbd> <kbd>1</kbd>-<kbd>9</kbd> workspaces &middot; <kbd>Ctrl</kbd> <kbd>,</kbd> settings</p>
      </div>
    </main>
    <div class="resizer" data-target="panel" hidden></div>
    <aside id="panel" hidden></aside>
  </div>
  <div id="overlay" hidden></div>
  <div id="popover" hidden></div>
  <div id="ac-pop" class="ac-pop" hidden></div>
</body>
</html>
