[workspace]
resolver = "2"
members = ["crates/agora-core", "crates/agora-mattermost", "crates/agora-rocketchat", "crates/agora-slack", "src-tauri", "probes"]

[workspace.package]
version = "0.6.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/nicoborghi/agora"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
fastrand = "2"
# No TLS backend here: each crate picks one per platform (see the connectors' Cargo.toml).
# Desktop: native-tls (Windows SChannel, system certificate store, no extra C toolchain).
# Android: rustls (OpenSSL does not cross-build easily).
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "multipart", "charset", "http2"] }
tokio-tungstenite = { version = "0.24" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic must stay "unwind": a panicking connector task is caught by its supervisor
# and restarted, instead of taking the whole app (and the other services) down.
