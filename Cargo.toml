[workspace]
resolver = "2"
members = ["crates/agora-core", "crates/agora-mattermost", "crates/agora-rocketchat", "crates/agora-slack", "src-tauri", "probes"]

[workspace.package]
version = "0.3.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/nicoborghi/agora"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
fastrand = "2"
# native-tls = Windows SChannel: uses the system certificate store and needs no extra C toolchain.
reqwest = { version = "0.12", features = ["json", "gzip", "multipart"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic must stay "unwind": a panicking connector task is caught by its supervisor
# and restarted, instead of taking the whole app (and the other services) down.
