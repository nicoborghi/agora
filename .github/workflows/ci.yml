name: CI

# One run per commit: every push to develop is tested. main only changes through pull requests from
# develop, whose latest commit already carries this "test" check, which is what the branch rule on
# main requires. (No pull_request trigger: a skipped run would count as passed and let a failing
# commit through. Contributions from forks go to develop first and are tested there.)
# Every push runs, website-only ones included: the latest commit of a pull request must carry the
# check, or the merge stays blocked. The installer is built only from tags (release.yml).
on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SQLCipher builds a vendored OpenSSL, which wants NASM on Windows.
      - uses: ilammy/setup-nasm@v1
      - name: Tests
        run: cargo test --workspace --locked
