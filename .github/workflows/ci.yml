name: Builds

# develop gets the full check ("test": every test plus a release build). It is the gate: main only
# changes through pull requests from develop, whose latest commit must carry a passing "test".
# main gets a quick check after each merge ("check": does it still compile?); the README badge
# shows that result. The installer is built only from tags (release.yml).
#
# No pull_request trigger: a skipped run would count as passed and could let a failing commit
# through. Contributions from forks go to develop first and are tested there. Every push runs,
# website-only ones included, so the latest commit of a pull request always carries the check.
on:
  push:
    branches: [develop, main]

# A new push cancels a run still going on the same branch: only the newest code is tested.
concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SQLCipher builds a vendored OpenSSL, which wants NASM on Windows.
      - uses: ilammy/setup-nasm@v1
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p agora

  check:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Compiles
        run: cargo check --workspace --locked
