name: Release

# The only workflow: nothing runs on ordinary pushes. Tag a commit on main to release it:
# the tests run first, then the build; the release is created at the very end, so it appears
# (and installed copies are offered it) only if everything succeeded.
#   git tag v0.1.1 && git push origin v0.1.1
# The tag must match "version" in tauri.conf.json. Releases are never marked as pre-releases:
# GitHub's "latest" link skips those, and installed copies find updates through it. (0.x = beta.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - run: npm ci
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for self-updates (secret: the content of ~/.tauri/agora.key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Agora ${{ github.ref_name }}
          releaseBody: |
            Windows installer below (per-user install, no admin rights needed).
            See the README for what is new and how to sign in to your workspaces.
          releaseDraft: false
          prerelease: false
          # latest.json: what installed copies read to find, download and verify the update.
          includeUpdaterJson: true
